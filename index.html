<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta property="og:title" content="Sinocircuit — China Executive Immersion Trip" />
<meta property="og:description" content="Seven days across China's hardware capital and its oldest karst landscapes. Shenzhen, Guilin, Yangshuo — September 2026. Limited to 16 executives." />
<meta property="og:image" content="https://www.sinocircuit.net/assets/og-image.jpg" />
<meta property="og:url" content="https://www.sinocircuit.net" />
<meta property="og:type" content="website" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting…</title>
  <meta name="description" content="Redirecting you to the English or Spanish version of the site." />
</head>
<body>
  <p>Redirecting you to the best language version of the site.</p>
  <p>If you're not redirected, choose a language:</p>
  <p><a href="/en/">English</a> · <a href="/es/">Español</a></p>
  <script>
    (function() {
      const spanishCountries = ['ES','MX','CO','AR','CL','PE','VE','EC','GT','CU','BO','DO','HN','PY','SV','NI','CR','PA','UY','GQ'];
      const supported = ['en','es'];
      const stored = localStorage.getItem('preferredLang');
      const languages = navigator.languages || [navigator.language || ''];
      const primaryLanguage = languages[0] || '';
      const prefersSpanish = /^es(?:[-_]|$)/i.test(primaryLanguage);
      const osSpanish = /^es(?:[-_]|$)/i.test(navigator.language || '');
      const preferred = stored && supported.includes(stored) ? stored : null;

      function getDestination() {
        if (preferred) return preferred;
        if (prefersSpanish || osSpanish) return 'es';
        return null;
      }

      async function detect() {
        const dest = getDestination();
        if (dest) return dest;

        try {
          const response = await fetch('https://ipapi.co/json/');
          if (response.ok) {
            const data = await response.json();
            if (data && data.country_code && spanishCountries.includes(data.country_code.toUpperCase())) {
              return 'es';
            }
          }
        } catch (error) {
          // ignore and fall back to English
        }

        return 'en';
      }

      detect().then((lang) => {
        if (window.location.protocol === 'file:') {
          // For file:// scheme, navigate to the language folder relative to the current directory
          const currentDir = window.location.pathname.replace(/[^\/]*$/, '');
          window.location.href = 'file://' + currentDir + lang + '/index.html';
        } else {
          window.location.replace('/' + lang + '/');
        }
      });
    })();
  </script>
  <noscript>
    <p>Please choose: <a href="/en/">English</a> or <a href="/es/">Español</a></p>
  </noscript>
</body>
</html>
